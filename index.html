<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Diecast Custom Price Calculator</title><style>body{font-family:Arial,sans-serif;background:#f4f4f4;margin:0;padding:20px}.container{max-width:800px;margin:auto;background:white;padding:25px;border-radius:12px;box-shadow:0 0 10px rgba(0,0,0,.1)}h1{text-align:center}label{display:block;margin-top:12px;font-weight:bold}input{width:100%;padding:8px;margin-top:4px;border:1px solid #ccc;border-radius:6px;box-sizing:border-box}button{width:100%;margin-top:20px;padding:14px;border:none;border-radius:8px;background:#0078d7;color:white;font-size:18px}.results{margin-top:30px;padding:20px;background:#eef7ff;border-radius:8px}</style></head><body><div class="container"><h1>Diecast Custom Price Calculator</h1><label>Diecast Purchase Cost ($)</label><input type="number" id="baseCost" value="0"><label>Parts Cost ($)</label><input type="number" id="partsCost" value="0"><label>Paint & Supplies Cost ($)</label><input type="number" id="suppliesCost" value="0"><label>Packaging Cost ($)</label><input type="number" id="packagingCost" value="0"><label>Hours Worked</label><input type="number" id="hoursWorked" value="0"><label>Hourly Rate ($)</label><input type="number" id="hourlyRate" value="25"><label>Profit Margin (%)</label><input type="number" id="profitMargin" value="30"><label>Etsy / Marketplace Fees (%)</label><input type="number" id="etsyFee" value="10"><label>Shipping Charged To Seller ($)</label><input type="number" id="shippingCost" value="0"><button onclick="calculatePrice()">Calculate Selling Price</button><div class="results"><div><strong>Total Material Cost:</strong> $<span id="materials">0.00</span></div><div><strong>Total Labor Cost:</strong> $<span id="labor">0.00</span></div><div><strong>Total Build Cost:</strong> $<span id="buildCost">0.00</span></div><div><strong>Suggested Selling Price:</strong> $<span id="salePrice">0.00</span></div><div><strong>Estimated Profit:</strong> $<span id="profit">0.00</span></div></div></div><script>function calculatePrice(){let baseCost=parseFloat(document.getElementById('baseCost').value)||0;let partsCost=parseFloat(document.getElementById('partsCost').value)||0;let suppliesCost=parseFloat(document.getElementById('suppliesCost').value)||0;let packagingCost=parseFloat(document.getElementById('packagingCost').value)||0;let hoursWorked=parseFloat(document.getElementById('hoursWorked').value)||0;let hourlyRate=parseFloat(document.getElementById('hourlyRate').value)||0;let profitMargin=parseFloat(document.getElementById('profitMargin').value)||0;let etsyFee=parseFloat(document.getElementById('etsyFee').value)||0;let shippingCost=parseFloat(document.getElementById('shippingCost').value)||0;let materialCost=baseCost+partsCost+suppliesCost+packagingCost;let laborCost=hoursWorked*hourlyRate;let buildCost=materialCost+laborCost+shippingCost;let salePrice=buildCost/(1-((profitMargin+etsyFee)/100));let estimatedProfit=salePrice-buildCost;document.getElementById('materials').innerText=materialCost.toFixed(2);document.getElementById('labor').innerText=laborCost.toFixed(2);document.getElementById('buildCost').innerText=buildCost.toFixed(2);document.getElementById('salePrice').innerText=salePrice.toFixed(2);document.getElementById('profit').innerText=estimatedProfit.toFixed(2);}</script></body></html>
