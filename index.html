<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diecast Custom Price Calculator Pro</title><style>body{font-family:Segoe UI,Arial,sans-serif;background:#111827;color:#f3f4f6;margin:0;padding:20px}.wrap{max-width:1000px;margin:auto}.card{background:#1f2937;padding:20px;border-radius:14px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}input,select,textarea{width:100%;padding:10px;border-radius:8px;border:1px solid #374151;background:#111827;color:#fff;box-sizing:border-box}button{background:#2563eb;color:#fff;border:none;padding:12px 18px;border-radius:10px;cursor:pointer;margin:5px}h1,h2{margin-top:0}.result{font-size:1.1em;margin:8px 0}.highlight{font-size:1.5em;color:#60a5fa;font-weight:bold}</style></head><body><div class="wrap"><div class="card"><h1>Diecast Custom Price Calculator Pro</h1><div class="grid"><div><label>Project Name</label><input id="project"></div><div><label>Preset</label><select id="preset" onchange="presetLoad()"><option>Custom</option><option>Wheel Swap</option><option>Basic Repaint</option><option>Full Custom</option></select></div></div></div><div class="card"><h2>Materials</h2><div class="grid"><input id="base" placeholder="Base Car Cost"><input id="parts" placeholder="Parts Cost"><input id="paint" placeholder="Paint Cost"><input id="decals" placeholder="Decals"><input id="printed" placeholder="3D Printed Parts"><input id="pack" placeholder="Packaging"></div></div><div class="card"><h2>Labor & Fees</h2><div class="grid"><input id="hours" placeholder="Hours Worked" value="0"><input id="rate" placeholder="Hourly Rate" value="25"><input id="etsy" placeholder="Marketplace Fee %" value="10"><input id="profitMargin" placeholder="Profit Margin %" value="30"><input id="shipping" placeholder="Shipping Cost" value="0"></div><button onclick="calc()">Calculate</button><button onclick="window.print()">Print Quote</button></div><div class="card"><h2>Results</h2><div class="result">Materials: $<span id="materials">0.00</span></div><div class="result">Labor: $<span id="labor">0.00</span></div><div class="result">Build Cost: $<span id="build">0.00</span></div><div class="result">Fees: $<span id="fees">0.00</span></div><div class="result highlight">Suggested Sale Price: $<span id="sale">0.00</span></div><div class="result">Net Profit: $<span id="profit">0.00</span></div><div class="result">Effective Hourly Wage: $<span id="hourly">0.00</span></div><hr><div id="tiers"></div></div><div class="card"><h2>Project Notes</h2><textarea rows="5"></textarea></div></div><script>function g(id){return parseFloat(document.getElementById(id).value)||0}function presetLoad(){let p=document.getElementById('preset').value;if(p==='Wheel Swap'){base.value=5;parts.value=8;hours.value=1}else if(p==='Basic Repaint'){base.value=5;paint.value=8;hours.value=3}else if(p==='Full Custom'){base.value=5;parts.value=25;paint.value=15;printed.value=10;hours.value=10}}function calc(){let mat=g('base')+g('parts')+g('paint')+g('decals')+g('printed')+g('pack');let labor=g('hours')*g('rate');let build=mat+labor+g('shipping');let feePct=(g('etsy')+g('profitMargin'))/100;let sale=build/(1-feePct);let fees=sale*(g('etsy')/100);let profit=sale-build-fees;let hourly=g('hours')?profit/g('hours'):0;materials.innerText=mat.toFixed(2);laborEl=labor.toFixed?labor.toFixed(2):labor;document.getElementById('labor').innerText=labor.toFixed(2);buildCost=build.toFixed(2);document.getElementById('build').innerText=buildCost;document.getElementById('fees').innerText=fees.toFixed(2);document.getElementById('sale').innerText=sale.toFixed(2);document.getElementById('profit').innerText=profit.toFixed(2);document.getElementById('hourly').innerText=hourly.toFixed(2);tiers.innerHTML='<h3>Pricing Targets</h3>20%: $'+(build/.8).toFixed(2)+'<br>30%: $'+(build/.7).toFixed(2)+'<br>40%: $'+(build/.6).toFixed(2)+'<br>50%: $'+(build/.5).toFixed(2);}</script></body></html>
